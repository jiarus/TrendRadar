app:
  timezone: "Asia/Shanghai"
  show_version_update: true

schedule:
  enabled: false
  preset: "morning_evening"

platforms:
  enabled: false
  sources: []

rss:
  enabled: true
  freshness_filter:
    enabled: true
    max_age_days: 1
  feeds:
    - id: "gamesindustry-news"
      name: "GamesIndustry News"
      url: "https://www.gamesindustry.biz/feed/news"
    - id: "gamedeveloper"
      name: "Game Developer"
      url: "https://www.gamedeveloper.com/rss.xml"
    - id: "adweek"
      name: "Adweek"
      url: "https://www.adweek.com/feed/"
    - id: "search-engine-journal"
      name: "Search Engine Journal"
      url: "https://www.searchenginejournal.com/feed/"
    - id: "martech"
      name: "MarTech"
      url: "https://martech.org/feed/"
    - id: "social-media-today"
      name: "Social Media Today"
      url: "https://www.socialmediatoday.com/feeds/news/"
    - id: "weibo-test-1"
      name: "Weibo Test Account 1"
      url: "https://rsshub.app/weibo/user/1642634100"
    - id: "weibo-test-2"
      name: "Weibo Test Account 2"
      url: "https://rsshub.app/weibo/user/1730077315"
    - id: "weibo-test-3"
      name: "Weibo Test Account 3"
      url: "https://rsshub.app/weibo/user/1917363437"

report:
  mode: "incremental"
  display_mode: "keyword"
  sort_by_position_first: false
  rank_threshold: 5
  max_news_per_keyword: 0

filter:
  method: "keyword"
  priority_sort_enabled: false

notification:
  enabled: true

ai:
  model: "deepseek/deepseek-chat"
  api_key: ""
  api_base: ""
  timeout: 120
  temperature: 1.0
  max_tokens: 5000

storage:
  backend: "auto"
  formats:
    sqlite: true
    txt: false
    html: true
  local:
    data_dir: "output"
    retention_days: 0
  remote:
    retention_days: 0

ai_analysis:
  enabled: true
  language: "Chinese"
  mode: "follow_report"
  max_news_for_analysis: 120
  include_rss: false
  include_standalone: true
  include_rank_timeline: true

display:
  region_order:
    - new_items
    - hotlist
    - rss
    - standalone
    - ai_analysis
  regions:
    hotlist: false
    new_items: false
    rss: true
    standalone: false
    ai_analysis: true
  standalone:
    platforms: []
    rss_feeds: []
    max_items: 20

advanced:
  debug: false
  crawler:
    request_interval: 2000
    use_proxy: false
    default_proxy: "http://127.0.0.1:10801"
  rss:
    request_interval: 1000
    timeout: 15
    use_proxy: false
    proxy_url: ""
  weight:
    rank: 0.6
    frequency: 0.3
    hotness: 0.1
  max_accounts_per_channel: 3
