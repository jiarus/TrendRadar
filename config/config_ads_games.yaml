app:
  timezone: "Asia/Shanghai"
  show_version_update: true

schedule:
  enabled: false
  preset: "morning_evening"

platforms:
  enabled: true
  sources:
    - id: "weibo"
      name: "微博"
    - id: "douyin"
      name: "抖音"
    - id: "bilibili-hot-search"
      name: "bilibili 热搜"
    - id: "zhihu"
      name: "知乎"
    - id: "toutiao"
      name: "今日头条"
    - id: "tieba"
      name: "贴吧"

rss:
  enabled: true
  freshness_filter:
    enabled: true
    max_age_days: 1
  feeds:
    - id: "hacker-news"
      name: "Hacker News"
      url: "https://hnrss.org/frontpage"

report:
  mode: "incremental"
  display_mode: "keyword"
  sort_by_position_first: false
  rank_threshold: 5
  max_news_per_keyword: 0

filter:
  method: "keyword"
  priority_sort_enabled: false

notification:
  enabled: true

storage:
  backend: "auto"
  formats:
    sqlite: true
    txt: false
    html: true
  local:
    data_dir: "output"
    retention_days: 0
  remote:
    retention_days: 0

ai_analysis:
  enabled: true
  language: "Chinese"
  mode: "follow_report"
  max_news_for_analysis: 120
  include_rss: false
  include_standalone: true
  include_rank_timeline: true

display:
  region_order:
    - new_items
    - hotlist
    - rss
    - standalone
    - ai_analysis
  regions:
    hotlist: true
    new_items: false
    rss: true
    standalone: false
    ai_analysis: true
  standalone:
    platforms: []
    rss_feeds: []
    max_items: 20

advanced:
  debug: false
  crawler:
    request_interval: 2000
    use_proxy: false
    default_proxy: "http://127.0.0.1:10801"
  rss:
    request_interval: 1000
    timeout: 15
    use_proxy: false
    proxy_url: ""
  weight:
    rank: 0.6
    frequency: 0.3
    hotness: 0.1
  max_accounts_per_channel: 3
